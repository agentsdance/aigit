name: Update Homebrew Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Published release tag to update the formula for
        required: true

permissions:
  contents: write

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master

      - name: Get release info
        id: release
        env:
          VERSION: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Download and calculate SHA256
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/$VERSION.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "$TARBALL_URL" -o "$RUNNER_TEMP/aigit-source.tar.gz"
          SHA256=$(sha256sum "$RUNNER_TEMP/aigit-source.tar.gz" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Update Formula
        run: |
          VERSION=${{ steps.release.outputs.version }}
          SHA256=${{ steps.release.outputs.sha256 }}

          mkdir -p Formula

          cat > Formula/aigit.rb << EOF
          class Aigit < Formula
            desc "AI-powered Git commit message generator using LLM"
            homepage "https://github.com/${{ github.repository }}"
            url "https://github.com/${{ github.repository }}/archive/refs/tags/$VERSION.tar.gz"
            sha256 "$SHA256"
            license "Apache-2.0"
            head "https://github.com/${{ github.repository }}.git", branch: "master"

            depends_on "go" => :build

            def install
              ldflags = %W[
                -s -w
                -X main.Version=#{version}
              ]

              system "go", "build", *std_go_args(ldflags: ldflags), "."
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/aigit version")
              assert_match "Generate git commit message", shell_output("#{bin}/aigit help")
            end

            def caveats
              <<~EOS
                Before using aigit, configure an AI provider:
                  aigit auth add openai YOUR_API_KEY
                  aigit auth add gemini YOUR_API_KEY
                  aigit auth add deepseek YOUR_API_KEY
                  aigit auth add doubao YOUR_API_KEY YOUR_ENDPOINT_ID

                Then use: aigit commit
              EOS
            end
          end
          EOF

      - name: Prepare formula branch for review
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "zzxwill"

          git add Formula/aigit.rb

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git switch -c "chore/homebrew-$VERSION"
            git commit -m "chore: update homebrew formula to ${{ steps.release.outputs.version }}

          - Update formula for version ${{ steps.release.outputs.version }}
          - SHA256: ${{ steps.release.outputs.sha256 }}"

            git push origin "HEAD:refs/heads/chore/homebrew-$VERSION"
            echo "Open a draft PR from chore/homebrew-$VERSION to master to publish the formula update." >> "$GITHUB_STEP_SUMMARY"
          fi
